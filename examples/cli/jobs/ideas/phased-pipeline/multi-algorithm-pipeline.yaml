# Chain multiple algorithms on one graph, mixing write/mutate modes.
# A `run` block batches several algorithms; writebacks run after Louvain mutates.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30

projections:
  - graph: social
    cypher: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })

pipeline:
  - project: social

  - run:
      - algorithm: wcc
        graph: social
        mode: mutate
        mutate_property: componentId
        parameters:
          concurrency: 4
      - algorithm: dijkstra
        graph: social
        mode: write
        write_property: distanceFromSource
        parameters:
          source_node: 42
      - algorithm: louvain
        graph: social
        mode: mutate
        mutate_property: community

  - writebacks:
      - graph: social
        node_properties: [community]

  - drop: [social]
