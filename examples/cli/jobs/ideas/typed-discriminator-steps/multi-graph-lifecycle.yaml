# Explicit per-graph lifecycle: project one graph, run algorithms on it, drop
# it, then project the next.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30

projections:
  - cypher:
      graph: "social"
      query: |
        MATCH (source:Person)-[rel:KNOWS]->(target:Person)
        RETURN gds.graph.project.remote(source, target, {
          sourceNodeLabels: labels(source),
          targetNodeLabels: labels(target),
          relationshipType: type(rel)
        })
  - cypher:
      graph: "pages"
      query: |
        MATCH (source:Page)-[rel:LINKS]->(target:Page)
        RETURN gds.graph.project.remote(source, target, {
          sourceNodeLabels: labels(source),
          targetNodeLabels: labels(target),
          relationshipType: type(rel)
        })

steps:
  - name: "Project the social graph"
    type: project
    params:
      graph: "social"

  - name: "Run Louvain on the social graph"
    type: algorithm
    params:
      algorithm: "louvain"
      graph: "social"
      mode:
        name: "mutate"
        property: "community"

  - name: "Write community back to the database"
    type: write-back
    params:
      graph: "social"
      node_properties: ["community"]

  - name: "Drop the social graph before projecting the next one"
    type: drop_graph
    params:
      graph: "social"

  - name: "Project the web graph"
    type: project
    params:
      graph: "pages"

  - name: "Run PageRank on the web graph"
    type: algorithm
    params:
      algorithm: "pageRank"
      graph: "pages"
      configuration:
        max_iterations: 20
      mode:
        name: "mutate"
        property: "pagerank"

  - name: "Write pagerank back to the database"
    type: write-back
    params:
      graph: "pages"
      node_properties: ["pagerank"]

  - name: "Drop the web graph"
    type: drop_graph
    params:
      graph: "pages"
