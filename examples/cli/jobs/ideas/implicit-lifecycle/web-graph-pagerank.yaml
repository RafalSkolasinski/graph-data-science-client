# PageRank on a web graph (Page -LINKS-> Page): important pages get high rank.
# Recreation of jobs/web-graph-pagerank.yaml using the implicit-lifecycle format.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30

projections:
  - graph: pages
    cypher: |
      MATCH (source:Page)-[rel:LINKS]->(target:Page)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })

algorithms:
  - name: pageRank
    graph: pages
    mode: mutate
    mutate_property: pagerank
    parameters:
      max_iterations: 20

writebacks:
  - graph: pages
    node_properties: [pagerank]
