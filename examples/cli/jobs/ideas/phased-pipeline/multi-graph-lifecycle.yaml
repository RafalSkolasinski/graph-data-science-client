# Explicit per-graph lifecycle: finish one graph (project/run/writebacks/drop)
# before projecting the next, instead of keeping both in session at once.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30

projections:
  - graph: social
    cypher: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })
  - graph: pages
    cypher: |
      MATCH (source:Page)-[rel:LINKS]->(target:Page)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })

pipeline:
  - project: social

  - run:
      - algorithm: louvain
        graph: social
        mode: mutate
        mutate_property: community

  - writebacks:
      - graph: social
        node_properties: [community]

  - drop: [social]

  - project: pages

  - run:
      - algorithm: pageRank
        graph: pages
        mode: mutate
        mutate_property: pagerank
        parameters:
          max_iterations: 20

  - writebacks:
      - graph: pages
        node_properties: [pagerank]

  - drop: [pages]
