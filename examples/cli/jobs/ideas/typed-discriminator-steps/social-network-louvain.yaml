# Louvain community detection on a social network (Person -KNOWS-> Person).
# Typed-discriminator steps: every step has a `type`, with fields in `params`.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30

projections:
  - cypher:
      graph: "social"
      query: |
        MATCH (source:Person)-[rel:KNOWS]->(target:Person)
        RETURN gds.graph.project.remote(source, target, {
          sourceNodeLabels: labels(source),
          targetNodeLabels: labels(target),
          relationshipType: type(rel)
        })

steps:
  - name: "Project the social graph"
    type: project
    params:
      graph: "social"

  - name: "Run Louvain"
    type: algorithm
    params:
      algorithm: "louvain"
      graph: "social"
      mode:
        name: "mutate"
        property: "community"

  - name: "Write community back to the database"
    type: write-back
    params:
      graph: "social"
      node_properties: ["community"]

  - name: "Drop the graph"
    type: drop_graph
    params:
      graph: "social"
