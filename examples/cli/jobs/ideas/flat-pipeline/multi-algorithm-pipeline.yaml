# Chain multiple algorithms on one graph, mixing write/mutate modes.
# Each algorithm is its own flat, named entry - no batching block needed.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30

projections:
  - graph: social
    cypher: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })

pipeline:
  - name: Project the social graph
    project_graph: social

  - name: Mutate weakly connected components
    algorithm: wcc
    graph: social
    mode: mutate
    mutate_property: componentId
    parameters:
      concurrency: 4

  - name: Write shortest-path distance from a fixed source
    algorithm: dijkstra
    graph: social
    mode: write
    write_property: distanceFromSource
    parameters:
      source_node: 42

  - name: Mutate with Louvain communities
    algorithm: louvain
    graph: social
    mode: mutate
    mutate_property: community

  - name: Write community back to the database
    write_back: social
    node_properties: [community]

  - name: Drop the graph
    drop_graph: social
